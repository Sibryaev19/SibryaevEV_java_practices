<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalog - REST API UI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">
    <header>
        <h1><i class="fas fa-book"></i> Каталог книг</h1>
        <p class="subtitle">REST API интерфейс для управления авторами и книгами</p>
    </header>

    <div class="content">
        <!-- СЕКЦИЯ АВТОРОВ -->
        <section class="section">
            <h2><i class="fas fa-user-pen"></i> Авторы</h2>

            <!-- Форма создания/редактирования автора -->
            <div class="card">
                <h3 id="authorFormTitle">Добавить нового автора</h3>
                <form id="authorForm">
                    <input type="hidden" id="authorId">

                    <div class="form-group">
                        <label for="fio">ФИО *</label>
                        <input type="text" id="fio" required placeholder="Иванов Иван Иванович">
                    </div>

                    <div class="form-group">
                        <label for="birthDate">Дата рождения</label>
                        <input type="date" id="birthDate">
                    </div>

                    <div class="form-group">
                        <label for="description">Описание</label>
                        <textarea id="description" rows="3" placeholder="Краткая биография..."></textarea>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Сохранить
                        </button>
                        <button type="button" id="cancelAuthorEdit" class="btn btn-secondary" style="display: none;">
                            Отмена
                        </button>
                    </div>
                </form>
            </div>

            <!-- Список авторов -->
            <div class="card">
                <h3>Список авторов</h3>
                <div id="authorsList" class="loading">Загрузка...</div>
            </div>
        </section>

        <!-- СЕКЦИЯ КНИГ -->
        <section class="section">
            <h2><i class="fas fa-book-open"></i> Книги</h2>

            <!-- Форма создания/редактирования книги -->
            <div class="card">
                <h3 id="bookFormTitle">Добавить новую книгу</h3>
                <form id="bookForm">
                    <input type="hidden" id="bookId">

                    <div class="form-group">
                        <label for="bookName">Название книги *</label>
                        <input type="text" id="bookName" required placeholder="Война и мир">
                    </div>

                    <div class="form-group">
                        <label for="bookAuthorId">Автор *</label>
                        <select id="bookAuthorId" required>
                            <option value="">Выберите автора...</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="publicationYear">Год издания</label>
                            <input type="number" id="publicationYear" min="1000" max="2100" placeholder="1869">
                        </div>

                        <div class="form-group">
                            <label for="pageNum">Количество страниц</label>
                            <input type="number" id="pageNum" min="1" placeholder="1225">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="bookDescription">Описание</label>
                        <textarea id="bookDescription" rows="3" placeholder="Аннотация книги..."></textarea>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Сохранить
                        </button>
                        <button type="button" id="cancelBookEdit" class="btn btn-secondary" style="display: none;">
                            Отмена
                        </button>
                    </div>
                </form>
            </div>

            <!-- Список книг -->
            <div class="card">
                <h3>Список книг</h3>
                <div id="booksList" class="loading">Загрузка...</div>
            </div>
        </section>
    </div>

    <footer>
        <p>REST API Endpoints:
            <code>/api/authors</code> |
            <code>/api/books</code> |
            Поддержка JSON/XML + XSLT преобразование
        </p>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
